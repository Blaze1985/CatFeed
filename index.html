<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CatCal Pro - Katzen Kalorien Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #090b0e 0%, #151921 50%, #0a0c10 100%);
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-border-flat: rgba(255, 255, 255, 0.12);
            --accent-cyan: #00f2fe;
            --accent-cyan-glow: rgba(0, 242, 254, 0.35);
            --chrome-glow: linear-gradient(135deg, #ffffff 0%, #90a4ae 50%, #37474f 100%);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --danger: #ff4d4d;
            --warning: #ffb703;
            --success: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border-flat);
            padding: 14px 18px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo-text {
            font-size: 1.4rem; font-weight: 900; letter-spacing: 1px;
            background: var(--chrome-glow);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sync-badge {
            font-size: 0.75rem; padding: 6px 12px; border-radius: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--card-border-flat);
            display: flex; align-items: center; gap: 6px; cursor: pointer;
        }

        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
        .sync-dot.online { background: var(--success); }

        .quick-feed-bar {
            background: rgba(18, 22, 29, 0.95);
            border-bottom: 1px solid var(--card-border-flat);
            padding: 12px 16px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .quick-feed-title {
            font-size: 0.75rem; color: var(--text-muted); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px;
        }

        .chip-food {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--card-border-flat);
            border-radius: 30px; padding: 6px 14px 6px 8px; cursor: pointer;
            transition: all 0.2s; font-size: 0.8rem;
        }

        .chip-food.active {
            background: rgba(0, 242, 254, 0.2); border-color: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan-glow); color: #fff; font-weight: 700;
        }

        .chip-food img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border-flat);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }

        .nav-btn {
            background: none; border: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 0.75rem; font-weight: 600; cursor: pointer; width: 33%;
        }

        .nav-btn.active { color: var(--accent-cyan); }
        .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

        .container { max-width: 600px; margin: 0 auto; padding: 16px; }

        .chrome-card {
            background: var(--card-bg); border-radius: 20px;
            border: 1px solid var(--card-border-flat); padding: 18px; margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(12px);
            position: relative; overflow: hidden;
        }

        .btn {
            background: linear-gradient(135deg, #2a3240 0%, #161b22 100%);
            border: 1px solid rgba(255,255,255,0.2); color: var(--text-main);
            padding: 12px 18px; border-radius: 12px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; width: 100%; transition: all 0.2s; font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000; font-weight: 800; border: none;
            box-shadow: 0 4px 15px var(--accent-cyan-glow);
        }

        .btn-danger {
            background: rgba(255, 77, 77, 0.15); border: 1px solid var(--danger); color: var(--danger);
        }

        .cat-tile { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .cat-avatar {
            width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent-cyan); box-shadow: 0 0 12px var(--accent-cyan-glow); background: #111;
        }

        .progress-bar-bg { background: rgba(255,255,255,0.08); height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-cyan), #4facfe); width: 0%; transition: width 0.4s ease; }
        .progress-bar-fill.over { background: linear-gradient(90deg, var(--warning), var(--danger)); }

        .quick-feed-box {
            display: flex; gap: 8px; margin-top: 10px; align-items: center;
        }

        .feed-log-list {
            margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 0.8rem; color: var(--text-muted);
        }
        .feed-log-item {
            display: flex; justify-content: space-between; align-items: center; padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .delete-icon-btn {
            background: rgba(255, 77, 77, 0.2); border: 1px solid var(--danger); color: var(--danger);
            border-radius: 6px; padding: 2px 8px; font-weight: bold; cursor: pointer; margin-left: 8px;
        }

        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 200;
            display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #161b22; border: 1px solid var(--card-border-flat);
            border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 22px;
        }

        input, select, textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border-flat); border-radius: 8px; color: #fff; margin-top: 6px; margin-bottom: 14px;
        }

        .bday-alert {
            background: rgba(255, 183, 3, 0.15); border: 1px solid var(--warning); color: var(--warning);
            padding: 10px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }

        canvas { width: 100%; height: 180px; background: rgba(0,0,0,0.25); border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">CatCal</div>
        <div class="sync-badge" onclick="switchTab('sync')">
            <div class="sync-dot" id="syncDot"></div>
            <span id="syncText">PIN Sync</span>
        </div>
    </header>

    <div class="quick-feed-bar" id="quickFeedBar"></div>

    <div class="container" id="appContent"></div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="navCats" onclick="switchTab('cats')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            Katzen
        </button>
        <button class="nav-btn" id="navFood" onclick="switchTab('food')">
            <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38l-.95 7.62h2l.95-7.62C10.54 12.9 12 11.12 12 9V2h-1v7zm7-7v18h2V2h-2z"/></svg>
            Futterbank
        </button>
        <button class="nav-btn" id="navSync" onclick="switchTab('sync')">
            <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            Sync
        </button>
    </nav>

    <!-- Modal: Katze erstellen / bearbeiten -->
    <div class="modal" id="catModal">
        <div class="modal-content">
            <h2 id="catModalTitle">Katze anlegen</h2>
            <input type="hidden" id="editCatId">
            
            <label>Foto:</label>
            <input type="file" id="catPhotoInput" accept="image/*" onchange="handleImageUpload(this, 'catPhotoPreview')">
            <input type="hidden" id="catPhotoPreview">

            <label>Name:</label>
            <input type="text" id="catName" placeholder="z.B. Luna">

            <label>Gewicht (kg):</label>
            <input type="number" id="catWeight" step="0.1" placeholder="z.B. 4.2">

            <label>Tägliches Kalorienziel (kcal):</label>
            <input type="number" id="catTargetKcal" placeholder="z.B. 210">

            <label>Geburtsdatum:</label>
            <input type="date" id="catBirthdate">

            <label>Geschlecht:</label>
            <select id="catGender">
                <option value="Weiblich">Weiblich</option>
                <option value="Männlich">Männlich</option>
            </select>

            <label>Kastriert:</label>
            <select id="catCastrated">
                <option value="Ja">Ja</option>
                <option value="Nein">Nein</option>
            </select>

            <button class="btn btn-primary" onclick="saveCatForm()">Speichern</button>
            <button class="btn" onclick="closeModal('catModal')" style="margin-top:10px;">Abbrechen</button>
        </div>
    </div>

    <!-- Modal: Futter anlegen -->
    <div class="modal" id="foodModal">
        <div class="modal-content">
            <h2>Futter speichern</h2>
            <label>Foto:</label>
            <input type="file" id="foodPhotoInput" accept="image/*" onchange="handleImageUpload(this, 'foodPhotoPreview')">
            <input type="hidden" id="foodPhotoPreview">

            <label>Name / Sorte:</label>
            <input type="text" id="foodName" placeholder="z.B. Lachs in Gelee">

            <label>Kategorie:</label>
            <select id="foodCategory">
                <option value="nass">Nassfutter</option>
                <option value="trocken">Trockenfutter</option>
                <option value="snack">Leckerlis</option>
            </select>

            <label>Kalorien pro 100g (kcal):</label>
            <input type="number" id="foodKcal" placeholder="z.B. 95">

            <button class="btn btn-primary" onclick="saveFoodForm()">Speichern</button>
            <button class="btn" onclick="closeModal('foodModal')" style="margin-top:10px;">Abbrechen</button>
        </div>
    </div>

    <!-- Modal: Bestätigung -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3 id="confirmTitle">Löschen bestätigen</h3>
            <p id="confirmText" style="margin: 15px 0; color: var(--text-muted);"></p>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn btn-danger" id="confirmBtn">Löschen</button>
                <button class="btn" onclick="closeModal('confirmModal')">Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        let appData = { cats: [], foods: [], logs: [], vet: [], weights: [] };
        let currentTab = 'cats';
        let activeCatId = null;
        let selectedTopFoodId = null;
        let syncPin = localStorage.getItem('catcal_pin') || '';

        function init() {
            loadLocal();
            if(syncPin) {
                document.getElementById('syncText').innerText = 'PIN: ' + syncPin;
                document.getElementById('syncDot').classList.add('online');
                fetchCloudData();
            }
            render();
        }

        function loadLocal() {
            const data = localStorage.getItem('catcal_data');
            if(data) appData = JSON.parse(data);
        }

        function saveData() {
            localStorage.setItem('catcal_data', JSON.stringify(appData));
            render();
            if(syncPin) pushCloudData();
        }

        async function pushCloudData() {
            if(!syncPin) return;
            try {
                const binId = getBinIdFromPin(syncPin);
                await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appData)
                });
            } catch(e) {}
        }

        async function fetchCloudData() {
            if(!syncPin) return;
            try {
                const binId = getBinIdFromPin(syncPin);
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`);
                if(res.ok) {
                    const json = await res.json();
                    if(json.record && json.record.cats) {
                        appData = json.record;
                        localStorage.setItem('catcal_data', JSON.stringify(appData));
                        render();
                    }
                }
            } catch(e) {}
        }

        function getBinIdFromPin(pin) {
            let hash = 0;
            for (let i = 0; i < pin.length; i++) {
                hash = ((hash << 5) - hash) + pin.charCodeAt(i);
                hash |= 0;
            }
            return 'bin_' + Math.abs(hash);
        }

        function handleImageUpload(input, targetId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(targetId).value = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveSyncPinFromTab() {
            const val = document.getElementById('syncPinTabInput').value.trim();
            syncPin = val;
            localStorage.setItem('catcal_pin', syncPin);
            if(syncPin) {
                document.getElementById('syncText').innerText = 'PIN: ' + syncPin;
                document.getElementById('syncDot').classList.add('online');
                fetchCloudData();
                alert('PIN gespeichert! Synchronisation gestartet.');
            } else {
                document.getElementById('syncText').innerText = 'PIN Sync';
                document.getElementById('syncDot').classList.remove('online');
            }
            render();
        }

        async function manualPush() {
            if(!syncPin) return alert('Bitte zuerst einen PIN/Raum-Code eingeben!');
            await pushCloudData();
            alert('Daten erfolgreich in die Cloud übertragen!');
        }

        async function manualPull() {
            if(!syncPin) return alert('Bitte zuerst einen PIN/Raum-Code eingeben!');
            await fetchCloudData();
            alert('Daten erfolgreich aus der Cloud geladen!');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function switchTab(tab) {
            currentTab = tab;
            if(tab !== 'catDetail') activeCatId = null;
            document.getElementById('navCats').classList.toggle('active', tab === 'cats' || tab === 'catDetail');
            document.getElementById('navFood').classList.toggle('active', tab === 'food');
            document.getElementById('navSync').classList.toggle('active', tab === 'sync');
            render();
        }

        function getTodayKcal(catId) {
            const today = new Date().toISOString().split('T')[0];
            return appData.logs
                .filter(l => l.catId === catId && l.date.startsWith(today))
                .reduce((sum, l) => sum + l.kcal, 0);
        }

        function getTodayLogs(catId) {
            const today = new Date().toISOString().split('T')[0];
            return appData.logs.filter(l => l.catId === catId && l.date.startsWith(today));
        }

        function checkBirthday(birthdate) {
            if(!birthdate) return false;
            const b = new Date(birthdate);
            const t = new Date();
            return b.getDate() === t.getDate() && b.getMonth() === t.getMonth();
        }

        function selectTopFood(foodId) {
            if(selectedTopFoodId === foodId) selectedTopFoodId = null;
            else selectedTopFoodId = foodId;
            render();
        }

        function renderQuickFeedBar() {
            const bar = document.getElementById('quickFeedBar');
            if(currentTab === 'sync') {
                bar.style.display = 'none';
                return;
            } else {
                bar.style.display = 'flex';
            }

            if(appData.foods.length === 0) {
                bar.innerHTML = '<span class="quick-feed-title">Wisch-Menü:</span> <span style="font-size:0.8rem; color:var(--text-muted);">Erstelle unten dein erstes Futter</span>';
                return;
            }

            let html = '<span class="quick-feed-title">Wahl-Futter:</span>';
            appData.foods.forEach(f => {
                const isActive = selectedTopFoodId === f.id;
                html += `
                    <div class="chip-food ${isActive ? 'active' : ''}" onclick="selectTopFood('${f.id}')">
                        <img src="${f.photo || 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=100'}">
                        <span>${f.name}</span>
                    </div>
                `;
            });
            bar.innerHTML = html;
        }

        function quickFeed(catId, inputElemId) {
            const grams = parseFloat(document.getElementById(inputElemId).value);
            if(!grams || grams <= 0) return alert('Bitte eine gültige Grammzahl eingeben!');

            let foodId = selectedTopFoodId;
            if(!foodId) {
                if(appData.foods.length > 0) foodId = appData.foods[0].id;
                else return alert('Bitte erst ein Futter in der Futterbank anlegen!');
            }

            const food = appData.foods.find(f => f.id === foodId);
            const kcalAdded = Math.round((grams / 100) * food.kcalPer100g);

            appData.logs.push({
                id: Date.now().toString(),
                catId: catId,
                foodId: foodId,
                grams: grams,
                kcal: kcalAdded,
                date: new Date().toISOString()
            });

            document.getElementById(inputElemId).value = '';
            saveData();
        }

        function render() {
            renderQuickFeedBar();
            const content = document.getElementById('appContent');
            if(currentTab === 'cats') content.innerHTML = renderCatsView();
            else if(currentTab === 'food') content.innerHTML = renderFoodView();
            else if(currentTab === 'sync') content.innerHTML = renderSyncView();
            else if(currentTab === 'catDetail') content.innerHTML = renderCatDetailView();
        }

        function renderSyncView() {
            return `
                <div class="chrome-card">
                    <h2>🔄 Cloud-Synchronisation</h2>
                    <p style="font-size:0.85rem; color:var(--text-muted); margin:10px 0;">
                        Nutze auf allen deinen Geräten (iPhone & Samsung Galaxy) denselben PIN-Code, um die Daten abzugleichen.
                    </p>

                    <label style="font-size:0.85rem; font-weight:bold;">Dein Raum-PIN / Synchronisations-Code:</label>
                    <input type="text" id="syncPinTabInput" value="${syncPin}" placeholder="z.B. meinekatzen123">

                    <button class="btn btn-primary" onclick="saveSyncPinFromTab()">PIN Speichern / Verbinden</button>
                </div>

                <div class="chrome-card">
                    <h3>Manuelle Cloud-Aktionen</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">
                        Verwende diese Buttons, um deine Daten manuell an die Cloud zu senden oder vom Partner-Handy zu laden.
                    </p>

                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <button class="btn btn-primary" onclick="manualPush()">☁️ Cloud Aktualisieren (Senden)</button>
                        <button class="btn" onclick="manualPull()">📥 Daten aus Cloud Laden (Empfangen)</button>
                    </div>
                </div>
            `;
        }

        function renderCatsView() {
            let html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><h2>Meine Katzen</h2><button class="btn btn-primary" style="width:auto;" onclick="openCatModal()">+ Katze</button></div>';
            
            if(appData.cats.length === 0) return html + '<div class="chrome-card" style="text-align:center;">Noch keine Katzen eingetragen.</div>';

            const activeTopFood = appData.foods.find(f => f.id === selectedTopFoodId) || appData.foods[0];

            appData.cats.forEach(cat => {
                const eatenKcal = getTodayKcal(cat.id);
                const remainingKcal = Math.max(0, cat.targetKcal - eatenKcal);
                const pct = Math.min(100, Math.round((eatenKcal / cat.targetKcal) * 100));
                const isBday = checkBirthday(cat.birthdate);
                const todayLogs = getTodayLogs(cat.id);

                let foodCalculatedText = '';
                if(activeTopFood) {
                    const gramsAllowed = Math.floor((remainingKcal / activeTopFood.kcalPer100g) * 100);
                    foodCalculatedText = `<div style="font-size:0.8rem; color:var(--accent-cyan); font-weight:bold; margin-top:4px;">Noch ${gramsAllowed}g von [${activeTopFood.name}] erlaubt</div>`;
                }

                let feedLogsHtml = '';
                if(todayLogs.length > 0) {
                    feedLogsHtml = '<div class="feed-log-list"><b style="color:var(--text-main); display:block; margin-bottom:4px;">Heutige Fütterungen:</b>';
                    todayLogs.forEach(log => {
                        const food = appData.foods.find(f => f.id === log.foodId);
                        const foodName = food ? food.name : 'Futter';
                        const timeStr = new Date(log.date).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                        feedLogsHtml += `
                            <div class="feed-log-item">
                                <span>🕒 ${timeStr} Uhr - ${foodName}</span>
                                <div>
                                    <b>${log.grams}g (${log.kcal} kcal)</b>
                                    <button class="delete-icon-btn" onclick="confirmDelete('log', '${log.id}')">✖</button>
                                </div>
                            </div>`;
                    });
                    feedLogsHtml += '</div>';
                }

                html += `
                    <div class="chrome-card">
                        ${isBday ? '<div class="bday-alert">🎉 Heute ist der Geburtstag von '+cat.name+'!</div>' : ''}
                        <div class="cat-tile" onclick="openCatDetail('${cat.id}')">
                            <img src="${cat.photo || 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=150'}" class="cat-avatar">
                            <div style="flex:1;">
                                <h3 style="font-size:1.3rem;">${cat.name}</h3>
                                <p style="font-size:0.85rem; color:var(--text-muted);">${cat.weight} kg • ${cat.gender} • ${cat.castrated === 'Ja' ? 'Kastriert' : 'Nicht'}</p>
                                ${foodCalculatedText}
                            </div>
                        </div>
                        <div style="margin-top:12px;">
                            <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                                <span>Heute: ${eatenKcal} / ${cat.targetKcal} kcal</span>
                                <span>${pct}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill ${eatenKcal > cat.targetKcal ? 'over' : ''}" style="width:${pct}%"></div>
                            </div>
                        </div>

                        <div class="quick-feed-box">
                            <input type="number" id="gramsInput_${cat.id}" placeholder="Gramm füttern..." style="margin:0;">
                            <button class="btn btn-primary" style="width:auto; white-space:nowrap;" onclick="quickFeed('${cat.id}', 'gramsInput_${cat.id}')">Füttern</button>
                        </div>

                        ${feedLogsHtml}
                    </div>
                `;
            });
            return html;
        }

        function openCatDetail(catId) {
            activeCatId = catId;
            currentTab = 'catDetail';
            render();
            setTimeout(() => drawWeightChart(catId), 100);
        }

        function renderCatDetailView() {
            const cat = appData.cats.find(c => c.id === activeCatId);
            if(!cat) return switchTab('cats');

            const eatenKcal = getTodayKcal(cat.id);
            const remainingKcal = Math.max(0, cat.targetKcal - eatenKcal);

            return `
                <button class="btn" style="width:auto; margin-bottom:15px;" onclick="switchTab('cats')">← Zurück zur Übersicht</button>
                
                <div class="chrome-card">
                    <div class="cat-tile">
                        <img src="${cat.photo || 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=150'}" class="cat-avatar" style="width:85px; height:85px;">
                        <div style="flex:1;">
                            <h2>${cat.name}</h2>
                            <p style="font-size:0.85rem; color:var(--text-muted);">${cat.weight} kg • ${cat.targetKcal} kcal Ziel</p>
                            <p style="font-size:0.85rem; color:var(--text-muted);">${cat.gender} • ${cat.castrated === 'Ja' ? 'Kastriert' : 'Nicht kastriert'}</p>
                            <p style="font-size:0.85rem; color:var(--text-muted);">Geburtstag: ${cat.birthdate || 'Nicht angegeben'}</p>
                        </div>
                    </div>
                    
                    <button class="btn" style="margin-top:15px;" onclick="editCat('${cat.id}')">✏️ Katze Bearbeiten</button>

                    <div style="margin-top:15px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                            <span>Verbleibend: ${remainingKcal} kcal</span>
                            <span>Gegessen: ${eatenKcal} kcal</span>
                        </div>
                    </div>
                </div>

                <div class="chrome-card">
                    <h3>Gewichtsdiagramm & Verlauf</h3>
                    <canvas id="weightChartCanvas"></canvas>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="number" id="newWeightInput" placeholder="Gewicht in kg" step="0.1" style="margin:0;">
                        <button class="btn btn-primary" style="width:auto;" onclick="addWeight('${cat.id}')">Wiegung Speichern</button>
                    </div>
                </div>

                <div class="chrome-card">
                    <h3>Arzttermine & Erinnerungen</h3>
                    <div style="margin:10px 0;">
                        <input type="text" id="vetTitle" placeholder="Grund (z.B. Impfung)" style="margin-bottom:6px;">
                        <input type="datetime-local" id="vetDate" style="margin-bottom:6px;">
                        <button class="btn btn-primary" onclick="addVetTermin('${cat.id}')">Termin Hinzufügen</button>
                    </div>
                    <ul style="list-style:none; font-size:0.85rem;">
                        ${(appData.vet.filter(v => v.catId === cat.id)).map(v => `<li style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;"><span>${v.title} (${new Date(v.date).toLocaleString('de-DE')})</span><button class="btn btn-danger" style="width:auto; padding:2px 6px; font-size:0.7rem;" onclick="confirmDelete('vet', '${v.id}')">x</button></li>`).join('') || 'Keine Termine'}
                    </ul>
                </div>

                <div class="chrome-card">
                    <h3>Notizen</h3>
                    <textarea id="catNotes" style="height:80px;" onchange="saveNotes('${cat.id}', this.value)">${cat.notes || ''}</textarea>
                    <button class="btn btn-danger" onclick="confirmDelete('cat', '${cat.id}')" style="margin-top:10px;">Katze Löschen</button>
                </div>
            `;
        }

        function drawWeightChart(catId) {
            const canvas = document.getElementById('weightChartCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const entries = appData.weights.filter(w => w.catId === catId);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(entries.length < 2) {
                ctx.fillStyle = '#8b949e';
                ctx.font = '12px sans-serif';
                ctx.fillText('Mindestens 2 Wiegungen für Verlauf nötig', 20, 90);
                return;
            }

            const weights = entries.map(e => parseFloat(e.weight));
            const minW = Math.min(...weights) - 0.5;
            const maxW = Math.max(...weights) + 0.5;

            ctx.beginPath();
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 3;

            entries.forEach((e, idx) => {
                const x = (idx / (entries.length - 1)) * (canvas.width - 60) + 30;
                const y = canvas.height - 40 - ((parseFloat(e.weight) - minW) / (maxW - minW)) * (canvas.height - 70);
                if(idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            entries.forEach((e, idx) => {
                const x = (idx / (entries.length - 1)) * (canvas.width - 60) + 30;
                const y = canvas.height - 40 - ((parseFloat(e.weight) - minW) / (maxW - minW)) * (canvas.height - 70);

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#00f2fe';
                ctx.fill();

                let label = e.date || '';
                if(label.includes(',')) label = label.split(',')[0];

                ctx.fillStyle = '#8b949e';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, x, canvas.height - 10);
                ctx.fillText(e.weight + 'kg', x, y - 10);
            });
        }

        function openCatModal() {
            document.getElementById('catModalTitle').innerText = 'Katze anlegen';
            document.getElementById('editCatId').value = '';
            document.getElementById('catName').value = '';
            document.getElementById('catWeight').value = '';
            document.getElementById('catTargetKcal').value = '';
            document.getElementById('catBirthdate').value = '';
            document.getElementById('catPhotoPreview').value = '';
            document.getElementById('catModal').classList.add('active');
        }

        function editCat(catId) {
            const cat = appData.cats.find(c => c.id === catId);
            if(!cat) return;
            document.getElementById('catModalTitle').innerText = 'Katze bearbeiten';
            document.getElementById('editCatId').value = cat.id;
            document.getElementById('catName').value = cat.name;
            document.getElementById('catWeight').value = cat.weight;
            document.getElementById('catTargetKcal').value = cat.targetKcal;
            document.getElementById('catBirthdate').value = cat.birthdate || '';
            document.getElementById('catGender').value = cat.gender || 'Weiblich';
            document.getElementById('catCastrated').value = cat.castrated || 'Ja';
            document.getElementById('catPhotoPreview').value = cat.photo || '';
            document.getElementById('catModal').classList.add('active');
        }

        function saveCatForm() {
            const id = document.getElementById('editCatId').value;
            const name = document.getElementById('catName').value.trim();
            const weight = parseFloat(document.getElementById('catWeight').value);
            const targetKcal = parseInt(document.getElementById('catTargetKcal').value);
            const birthdate = document.getElementById('catBirthdate').value;
            const gender = document.getElementById('catGender').value;
            const castrated = document.getElementById('catCastrated').value;
            const photo = document.getElementById('catPhotoPreview').value;

            if(!name || !weight || !targetKcal) return alert('Bitte Name, Gewicht und Ziel-Kcal angeben!');

            if(id) {
                const cat = appData.cats.find(c => c.id === id);
                if(cat) Object.assign(cat, { name, weight, targetKcal, birthdate, gender, castrated, photo });
            } else {
                appData.cats.push({ id: Date.now().toString(), name, weight, targetKcal, birthdate, gender, castrated, photo, notes: '' });
            }

            saveData();
            closeModal('catModal');
        }

        function openFoodForm() {
            document.getElementById('foodName').value = '';
            document.getElementById('foodKcal').value = '';
            document.getElementById('foodPhotoPreview').value = '';
            document.getElementById('foodModal').classList.add('active');
        }

        function saveFoodForm() {
            const name = document.getElementById('foodName').value.trim();
            const category = document.getElementById('foodCategory').value;
            const kcalPer100g = parseInt(document.getElementById('foodKcal').value);
            const photo = document.getElementById('foodPhotoPreview').value;

            if(!name || !kcalPer100g) return alert('Bitte Name und Kalorien pro 100g angeben!');

            appData.foods.push({ id: Date.now().toString(), name, category, kcalPer100g, photo });
            saveData();
            closeModal('foodModal');
        }

        let pendingDeleteType = null, pendingDeleteId = null;

        function confirmDelete(type, id) {
            pendingDeleteType = type; pendingDeleteId = id;
            document.getElementById('confirmTitle').innerText = 'Eintrag Löschen?';
            document.getElementById('confirmText').innerText = 'Möchtest du diesen Eintrag wirklich löschen?';
            document.getElementById('confirmBtn').onclick = executeDelete;
            document.getElementById('confirmModal').classList.add('active');
        }

        function executeDelete() {
            if(pendingDeleteType === 'cat') {
                appData.cats = appData.cats.filter(c => c.id !== pendingDeleteId);
                switchTab('cats');
            } else if(pendingDeleteType === 'food') {
                appData.foods = appData.foods.filter(f => f.id !== pendingDeleteId);
            } else if(pendingDeleteType === 'vet') {
                appData.vet = appData.vet.filter(v => v.id !== pendingDeleteId);
            } else if(pendingDeleteType === 'log') {
                appData.logs = appData.logs.filter(l => l.id !== pendingDeleteId);
            }
            saveData();
            closeModal('confirmModal');
        }

        function renderFoodView() {
            let html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><h2>Futterbank</h2><button class="btn btn-primary" style="width:auto;" onclick="openFoodForm()">+ Futter</button></div>';

            if(appData.foods.length === 0) return html + '<div class="chrome-card" style="text-align:center;">Noch kein Futter gespeichert.</div>';

            ['nass', 'trocken', 'snack'].forEach(catKey => {
                const title = catKey === 'nass' ? '🥣 Nassfutter' : catKey === 'trocken' ? '🌾 Trockenfutter' : '🍬 Leckerlis';
                const items = appData.foods.filter(f => f.category === catKey);

                html += `<h3 style="margin:15px 0 8px 0; color:var(--text-muted);">${title}</h3>`;
                items.forEach(food => {
                    html += `
                        <div class="chrome-card" style="padding:12px; display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <img src="${food.photo || 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=100'}" style="width:45px; height:45px; border-radius:8px; object-fit:cover;">
                                <div>
                                    <b>${food.name}</b>
                                    <div style="font-size:0.75rem; color:var(--text-muted);">${food.kcalPer100g} kcal / 100g</div>
                                </div>
                            </div>
                            <button class="btn btn-danger" style="width:auto; padding:4px 8px;" onclick="confirmDelete('food', '${food.id}')">Löschen</button>
                        </div>
                    `;
                });
            });

            return html;
        }

        function addWeight(catId) {
            const val = parseFloat(document.getElementById('newWeightInput').value);
            if(!val) return;

            const now = new Date();
            const dateStr = now.toLocaleDateString('de-DE') + ', ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

            appData.weights.push({ catId, weight: val, date: dateStr });
            const cat = appData.cats.find(c => c.id === catId);
            if(cat) cat.weight = val;
            saveData();
            setTimeout(() => drawWeightChart(catId), 50);
        }

        function addVetTermin(catId) {
            const title = document.getElementById('vetTitle').value;
            const date = document.getElementById('vetDate').value;
            if(!title || !date) return;
            appData.vet.push({ id: Date.now().toString(), catId, title, date });
            saveData();
        }

        function saveNotes(catId, val) {
            const cat = appData.cats.find(c => c.id === catId);
            if(cat) { cat.notes = val; saveData(); }
        }

        init();
    </script>
</body>
</html>
